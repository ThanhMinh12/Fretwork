name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test and MCP dependencies
        run: pip install fastapi==0.143.3 starlette==1.8.0 pydantic==2.14.1 anyio==4.15.1 uvicorn==0.54.0 python-multipart==0.0.32 itsdangerous==2.2.0 mcp==2.3.0 httpx==0.28.1 pytest==8.3.4 'numpy<2' scipy music21 'langgraph>=0.2,<2' 'langchain-core>=0.3,<2'
      - name: Core tests
        run: python -m unittest discover -s tests -v
      - name: API tests
        run: python -m pytest api_tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
