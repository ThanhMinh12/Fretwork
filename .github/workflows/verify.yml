name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test and MCP dependencies
        run: pip install fastapi==0.143.3 starlette==1.8.0 pydantic==2.14.1 anyio==4.15.1 uvicorn==0.54.0 python-multipart==0.0.32 itsdangerous==2.2.0 mcp==2.3.0 httpx==0.28.1 pytest==8.3.4 'numpy<2' scipy music21 'langgraph>=0.2,<2' 'langchain-core>=0.3,<2'
      - name: Core tests
        run: python -m unittest discover -s tests -v
      - name: API tests
        run: python -m pytest api_tests -q
      - name: Hosted demo limits and MusicXML engraving
        run: |
          pip install soundfile==0.14.0 verovio==6.3.0 gradio==6.30.0
          python -m pytest hf_space/test_demo.py hf_space/test_fullstack.py -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser test tools
        run: |
          pip install playwright==1.55.0
          playwright install --with-deps chromium
      - name: Verify the simplified transcription interface
        run: |
          node web/node_modules/vite/bin/vite.js preview web --host 127.0.0.1 --port 4175 > /tmp/fretwork-web.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4175/ >/dev/null; then break; fi
            sleep 1
          done
          python scripts/smoke_ui.py --url http://127.0.0.1:4175 --screenshots /tmp/fretwork-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fretwork-ui-verification
          path: /tmp/fretwork-ui/

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fretwork:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the non-root image and verify API and frontend
        run: |
          docker run --detach --name fretwork-ci --publish 127.0.0.1:8000:8000 fretwork:ci
          trap 'docker logs fretwork-ci; docker stop fretwork-ci >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/api/health
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null
          test "$(docker exec fretwork-ci id -u)" = "10001"
          docker exec fretwork-ci python -c "from pathlib import Path; assert Path('/data/.session-secret').stat().st_mode & 0o077 == 0"
